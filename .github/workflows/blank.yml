name: Build LaTeX PDF

on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'initiativen/**'
      - 'config/**'
  pull_request:
    paths:
      - 'main.tex'
      - 'initiativen/**'
      - 'config/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode main.tex && mv main.pdf Studierendeninitiativen.pdf

      - name: Commit PDF back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update PDF"
          file_pattern: Studierendeninitiativen.pdf
